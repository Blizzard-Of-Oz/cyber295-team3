<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gmail Agent UI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div>
          <h1>Gmail Agent UI</h1>
          <p>Describe the task and let the agent call Gmail tools.</p>
        </div>
        <div id="userInfo" class="user-info" style="display: none;">
          <span id="userName" class="user-name"></span>
          <button id="signoutBtn" class="ghost">Sign out</button>
        </div>
      </header>

      <main id="content">
        <div id="authPrompt" class="auth-prompt" style="display: none;">
          <div class="auth-card">
            <h2>Authentication required</h2>
            <p>Sign in with Microsoft to use the Gmail agent.</p>
            <button id="signinBtn">Sign in with Microsoft</button>
          </div>
        </div>
        <section class="card">
          <label for="requirement">Requirement</label>
          <textarea id="requirement" placeholder="e.g. Send an email to alice@example.com with subject 'Report' and attach /tmp/report.pdf"></textarea>
          <div class="actions">
            <button id="run">Run</button>
            <span id="status"></span>
          </div>
        </section>

        <section class="card">
          <h2>Agent Response</h2>
          <pre id="summary">Waiting for input...</pre>
        </section>

        <section class="card">
          <h2>Tool Calls</h2>
          <pre id="toolCalls">None</pre>
        </section>

        <section class="card">
          <h2>Tool Outputs</h2>
          <pre id="toolOutputs">None</pre>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
